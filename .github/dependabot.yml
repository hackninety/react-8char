# 依赖自动更新：替代原先的 fork 同步工作流（auto-update-bazi-lib.yml）。
# 排盘引擎已改为 npm 直接依赖（mystilight-8char / tyme4ts），
# 由 Dependabot 每周一检查更新并提 PR，合并后 Cloudflare Pages 自动部署。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Shanghai
    # 只关注排盘引擎相关依赖，避免 PR 噪音
    allow:
      - dependency-name: mystilight-8char
      - dependency-name: tyme4ts
      - dependency-name: lunar-javascript
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
